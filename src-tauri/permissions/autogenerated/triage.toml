[[permission]]
identifier = "allow-mutate-threads"
description = "Enables the generalized triage mutation (delete, move, spam, star, read/unread, labels) over a set of threads."
commands.allow = ["mutate_threads"]

[[permission]]
identifier = "allow-mutate-messages"
description = "Enables message-scoped triage mutation."
commands.allow = ["mutate_messages"]

[[permission]]
identifier = "allow-delete-draft"
description = "Enables deleting a draft through Gmail's dedicated drafts endpoint."
commands.allow = ["delete_draft"]

[[permission]]
identifier = "allow-delete-threads"
description = "Enables deleting threads by intent; Rust computes the label arithmetic from real membership."
commands.allow = ["delete_threads"]

[[permission]]
identifier = "allow-move-threads"
description = "Enables moving threads to a destination folder by intent; Rust computes the label arithmetic from real membership."
commands.allow = ["move_threads"]

[[permission]]
identifier = "allow-delete-messages"
description = "Enables deleting individual messages by intent; Rust computes the label arithmetic from real membership."
commands.allow = ["delete_messages"]

[[permission]]
identifier = "allow-move-messages"
description = "Enables moving individual messages to a destination folder by intent; Rust computes the label arithmetic from real membership."
commands.allow = ["move_messages"]
