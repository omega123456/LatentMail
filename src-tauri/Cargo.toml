[package]
name = "latentmail"
version = "0.1.4"
description = "LatentMail desktop Gmail client"
authors = ["LatentMail"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "latentmail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "latentmail"
test = false
required-features = ["app"]

[build-dependencies]
serde_json = "~1.0.151"
tauri-build = { version = "~2.6.3", features = [] }

[dependencies]
ammonia = "~4.1.4"
base64 = "~0.22.1"
chrono = { version = "~0.4.45", features = ["serde"] }
encoding_rs = "~0.8.35"
hickory-resolver = "~0.26.1"
image = { version = "~0.25.10", default-features = false, features = ["png", "tiff"] }
keyring = { version = "~3.6.3", features = ["apple-native", "windows-native"] }
lettre = { version = "~0.11.23", default-features = false, features = ["builder"] }
html2text = "~0.13.6"
mime = "~0.3.17"
oauth2 = "~5.0.0"
psl = "~2.1.224"
refinery = { version = "~0.8.16", features = ["rusqlite"] }
reqwest = { version = "~0.12.28", features = ["json", "rustls-tls"] }
resvg = "~0.48.1"
rusqlite = { version = "~0.32.1", features = ["bundled"] }
serde = { version = "~1.0.229", features = ["derive"] }
serde_json = "~1.0.151"
sha2 = "~0.10.9"
usvg = "~0.48.1"
url = "~2.5.8"
tauri = { version = "~2.11.5", features = ["test", "protocol-asset", "tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "~2.5.4"
tauri-plugin-dialog = "~2.7.2"
tauri-plugin-prevent-default = "~4.0.4"
thiserror = "~2.0.20"
tokio = { version = "~1.53.1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "test-util"] }
tracing = "~0.1.44"
tracing-appender = "~0.2.5"
tracing-subscriber = "~0.3.23"
user-notify = "~0.4.2"
tauri-plugin-single-instance = { version = "~2.4.3", features = ["deep-link"] }
tauri-plugin-deep-link = "~2.4.9"
tauri-plugin-os = "~2.3.2"
tauri-plugin-updater = "~2.10.1"

[target.'cfg(windows)'.dependencies]
tauri-plugin-prevent-default = { version = "~4.0.4", features = ["platform-windows"] }
tauri-plugin-autostart = "~2.5.1"
windows = { version = "~0.61.3", features = ["Win32_Foundation", "Win32_System_Power", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "~0.6.2"
objc2 = "~0.6.4"
objc2-app-kit = { version = "~0.3.2", features = ["NSWorkspace"] }
objc2-foundation = { version = "~0.3.2", features = ["NSNotification", "NSOperation", "NSString", "block2"] }

[dev-dependencies]
tempfile = "~3.27.0"
wiremock = "~0.6.5"
# Adds the "unstable" tauri feature (window-fetching APIs) for integration
# tests only; resolver v2 keeps this out of the shipped app/lib build.
tauri = { version = "~2.11.5", features = ["test", "unstable", "protocol-asset"] }

[features]
default = ["app"]
app = []
test-utils = []
