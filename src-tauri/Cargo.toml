[package]
name = "latentmail"
version = "0.1.0"
description = "LatentMail desktop Gmail client"
authors = ["LatentMail"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "latentmail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "latentmail"
test = false
required-features = ["app"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
ammonia = "4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
hickory-resolver = "0.26.1"
image = { version = "0.25.10", default-features = false, features = ["png", "tiff"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
lettre = { version = "0.11", default-features = false, features = ["builder"] }
html2text = "0.13"
mime = "0.3"
oauth2 = "5"
psl = "2.1.224"
refinery = { version = "0.8", features = ["rusqlite"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
resvg = "0.48.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
usvg = "0.48.1"
url = "2"
tauri = { version = "2", features = ["test", "protocol-asset", "tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-prevent-default = "4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "test-util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
user-notify = "0.4.2"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-os = "2.3.2"
tauri-plugin-updater = "~2.10.1"

[target.'cfg(windows)'.dependencies]
tauri-plugin-prevent-default = { version = "4", features = ["platform-windows"] }
tauri-plugin-autostart = "2.5.1"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
# Adds the "unstable" tauri feature (window-fetching APIs) for integration
# tests only; resolver v2 keeps this out of the shipped app/lib build.
tauri = { version = "2", features = ["test", "unstable", "protocol-asset"] }

[features]
default = ["app"]
app = []
test-utils = []
