# These cases each boot a full mock Tauri app and use process-wide app-data
# configuration. Running their individual processes together starves the
# queue's real async Gmail round trips under a saturated test run.
[test-groups.compose-app]
max-threads = 1

[test-groups.reconcile-network]
max-threads = 1

[test-groups.ipc-contract]
max-threads = 1

[test-groups.ai-loopback]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary(=compose_drafts_integration)'
test-group = 'compose-app'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'binary(=reconcile_staging_atomic_integration)'
test-group = 'reconcile-network'

[[profile.default.overrides]]
filter = 'binary(=reconcile_staging_completed_integration)'
test-group = 'reconcile-network'

[[profile.default.overrides]]
filter = 'binary(=reconcile_staging_equivalence_integration)'
test-group = 'reconcile-network'

[[profile.default.overrides]]
filter = 'binary(=reconcile_staging_fetch_integration)'
test-group = 'reconcile-network'

[[profile.default.overrides]]
filter = 'binary(=reconcile_staging_labels_integration)'
test-group = 'reconcile-network'

[[profile.default.overrides]]
filter = 'binary(=reconcile_staging_malformed_integration)'
test-group = 'reconcile-network'

[[profile.default.overrides]]
filter = 'binary(=reconcile_staging_universe_integration)'
test-group = 'reconcile-network'

[[profile.default.overrides]]
filter = 'binary(=sync_concurrency_integration)'
test-group = 'reconcile-network'

[[profile.default.overrides]]
filter = 'binary(=ipc_contract_integration)'
test-group = 'ipc-contract'
threads-required = "num-cpus"

[[profile.default.overrides]]
filter = 'binary(=ai_provider_client_integration)'
test-group = 'ai-loopback'

[[profile.default.overrides]]
filter = 'binary(=ai_index_build_integration)'
test-group = 'ai-loopback'

[[profile.default.overrides]]
filter = 'binary(=ai_command_failures_integration)'
test-group = 'ai-loopback'
